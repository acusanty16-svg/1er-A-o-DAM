# Docker Compose: levanta PostgreSQL para el ejercicio2
# Ejecutar con: docker-compose up -d
# Detener con: docker-compose down

services:
  postgres:
    image: postgres:16
    container_name: biblioteca_postgres
    environment:
      POSTGRES_DB: biblioteca_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - biblioteca_data:/var/lib/postgresql/data

volumes:
  biblioteca_data: